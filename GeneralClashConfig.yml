# 基于 ACL4SSR GeneralClashConfig.yml，增加 DNS 配置

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
ipv6: true
log-level: info
external-controller: '127.0.0.1:9090'

experimental:
  ignore-resolve-fail: true

dns:
  enable: true
  ipv6: false
  respect-rules: true
  default-nameserver:
    - 119.29.29.29
    - 114.114.114.114
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://dot.pub
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
  use-hosts: true
  nameserver:
    - https://doh.pub/dns-query
    - tls://dot.pub
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - tls://dns.alidns.com
    - tls://223.5.5.5:853
    - tls://223.6.6.6:853
  fallback:
    - https://doh.pub/dns-query
    - tls://dot.pub
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - tls://dns.alidns.com
    - tls://223.5.5.5:853
    - tls://223.6.6.6:853
  fallback-filter:
    geoip: true
    domain:
      - +.linkedin.com
      - +.linkedin.cn
      - +.linkedin.at
      - +.licdn.com
      - +.licdn.cn
      - +.lnkd.in
      - +.bizographics.com
      - +.linkedin-ei.com
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

cfw-latency-timeout: 3000
cfw-latency-url: http://www.gstatic.com/generate_204

cfw-conn-break-strategy:
  proxy: none
  profile: true
  mode: false

cfw-proxies-order: default
